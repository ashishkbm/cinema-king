services:
  cinema-king-renderer:
    build:
      context: .
      dockerfile: render_service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8787}
      CINEMA_KING_RENDER_TOKEN: ${CINEMA_KING_RENDER_TOKEN:?Set CINEMA_KING_RENDER_TOKEN in your server .env}
      CINEMA_KING_ALLOWED_ORIGINS: ${CINEMA_KING_ALLOWED_ORIGINS:-capacitor://localhost,https://localhost}
    ports:
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
