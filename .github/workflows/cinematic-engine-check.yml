name: Cinema King integration checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Verify web application
        run: |
          npm run verify
          npm test
      - name: Install render-service dependencies
        run: python -m pip install -r render_service/requirements.txt
      - name: Validate Python source and adapter
        run: |
          python -m compileall -q cinematic-engine/cinematic-film/scripts render_service
          python -m unittest render_service.test_service
